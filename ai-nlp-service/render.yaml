services:
  - type: web
    name: ai-talent-hybrid-search
    env: python
    buildCommand: pip install uv && uv pip install --system -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MONGO_URI
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
